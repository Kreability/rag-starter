name: rag-system

# Core stack:  docker compose up
# With tracing: docker compose -f docker-compose.yaml -f docker-compose.observability.yml up
# With local models (no API key needed): docker compose --profile local-llm up

x-backend-env: &backend-env
  env_file:
    - path: .env.backend
      required: false

services:
  # --------------------------------------------------------------- data ---
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 768m
    expose:
      - "5432"
    ports:
      # Host port is configurable so the stack does not collide with a local
      # Postgres. Containers always talk to db:5432 over the compose network.
      - "${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the auxiliary `langfuse` database on first boot.
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-change-password}"
      POSTGRES_DB: "${DATABASE_NAME:-db}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-grade vector database: HNSW index, hybrid dense+sparse search,
  # payload filtering, snapshots. Persisted to a named volume.
  qdrant:
    # Pinned in step with `qdrant-client` in backend/pyproject.toml — the client
    # warns when major/minor diverge. Note that Qdrant storage is NOT forward
    # compatible: bumping this across minor versions requires a snapshot restore
    # (or a wiped volume), so change both together, deliberately.
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    mem_limit: 1g
    expose:
      - "6333"
      - "6334"
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    # NOTE: Qdrant is not published to the host by default and is only reachable
    # on the compose network. To require an API key (recommended when exposing
    # it), set VECTOR_DB_API_KEY in .env.backend and uncomment the line below —
    # an *empty* QDRANT__SERVICE__API_KEY still forces auth and rejects requests,
    # so it must be omitted entirely rather than set to "".
    environment:
      # QDRANT__SERVICE__API_KEY: "${VECTOR_DB_API_KEY}"
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: "2"
    healthcheck:
      # The image is distroless: no curl/wget, so probe from Qdrant's own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 768m
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the original files behind every citation.
  minio:
    build: ./docker/minio
    image: rag-minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ backend ---
  api:
    build:
      context: backend
      target: development
    restart: unless-stopped
    # 1g measured ~1021MiB in normal use (Django + cached embedder + reranker
    # weights); 1536m still hit the ceiling and got OOM-killed mid-request
    # (peaked ~1.19GiB) — confirmed via `docker inspect --format
    # '{{.State.OOMKilled}}'` reading true after a live chat request. 2g
    # matches the worker container's limit and leaves real headroom above
    # the observed peak.
    mem_limit: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "uv sync &&
               uv run -- python manage.py collectstatic --noinput &&
               uv run -- python manage.py migrate &&
               uv run -- python manage.py init_rag --wait 60 &&
               uv run -- gunicorn api.wsgi:application -c gunicorn.conf.py"
    env_file:
      - path: .env.backend
        required: false
      # Also read the frontend's dev credentials so `init_rag` can recreate the
      # account the frontend signs in as. Keeping them in one file avoids the
      # two copies drifting apart. Harmless in production: without DEV_PASSWORD
      # the step is skipped.
      - path: .env.frontend
        required: false
    expose:
      - "8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Share only the ML model caches (embedding + rerank weights). Sharing
      # all of /root/.cache would put uv's wheel cache under concurrent write
      # from api and worker, which fails on startup.
      - model-cache:/root/.cache/huggingface
      - flashrank-cache:/tmp/flashrank
    healthcheck:
      # `start_period` is generous: the dev command runs `uv sync` and migrations
      # before Django listens, and failures during it do not count as retries.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Same image, same codebase, different command. Not a microservice.
  worker:
    build:
      context: backend
      target: worker-full
    restart: unless-stopped
    # 2g wasn't even enough for ONE conversion: a full-length book PDF through
    # Docling's layout+OCR+table-structure model stack got SIGKILLed on all 3
    # retry attempts at 2g (confirmed via repeated WorkerLostError/SIGKILL 9 in
    # logs, container RSS climbing past 1.9GiB before each kill). 4g leaves
    # real headroom for large real-world documents, not just small test files.
    mem_limit: 4g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "uv sync --frozen --no-dev --extra docling --extra evaluation &&
               uv run -- celery -A api worker --loglevel=INFO --concurrency=1"
    # concurrency=1, not 2: two simultaneous Docling conversions (each loading
    # its own full layout/OCR/table-structure model stack) would only compound
    # the memory pressure above. One conversion at a time trades ingestion
    # throughput for not crashing on real documents.
    <<: *backend-env
    environment:
      # The worker image contains Docling; keep the API slim and fallback-only.
      INGESTION_PREFER_DOCLING: "true"
    volumes:
      - ./backend:/app
      # Share only the ML model caches (embedding + rerank weights). Sharing
      # all of /root/.cache would put uv's wheel cache under concurrent write
      # from api and worker, which fails on startup.
      - model-cache:/root/.cache/huggingface
      - flashrank-cache:/tmp/flashrank
    healthcheck:
      # `celery inspect ping` fails until the worker has registered with the broker.
      test: ["CMD-SHELL", "uv run -- celery -A api inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Periodic jobs (reaps documents stuck in PROCESSING).
  beat:
    build:
      context: backend
      target: development
    restart: unless-stopped
    mem_limit: 256m
    command: >
      bash -c "uv sync &&
               uv run -- celery -A api beat --loglevel=INFO"
    <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  # ----------------------------------------------------------- frontend ---
  web:
    build:
      context: frontend
      # Must be explicit. Without it Compose builds the LAST stage, which is
      # `production` — the standalone-bundle stage that carries `USER node`.
      # The dev command then ran as uid 1000 against root-owned anonymous
      # volumes and every pnpm symlink failed with "Permission denied (os
      # error 13)".
      target: development
    restart: unless-stopped
    mem_limit: 1g
    command: bash -c "pnpm install -r && pnpm --filter web dev"
    volumes:
      - ./frontend:/app
      # Mask EVERY node_modules in the pnpm workspace, not just the root one.
      # pnpm keeps the real packages in a single virtual store at
      # /app/node_modules/.pnpm, and the per-package node_modules hold only
      # symlinks and .bin shims into it. Masking just the root left
      # apps/web/node_modules and packages/*/node_modules bind-mounted from the
      # host, so `pnpm install` saw them as already satisfied ("Already up to
      # date" in ~2ms), never populated the masked root store, and the shim's
      # target ../../../../node_modules/.pnpm/next@.../dist/bin/next resolved
      # into an empty volume — `next dev` died with exit 127 and the container
      # restart-looped. Keep this list in sync with pnpm-workspace.yaml.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/types/node_modules
    expose:
      - "3000"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    env_file:
      - path: .env.frontend
        required: false
    healthcheck:
      # node:*-slim ships neither curl nor wget, so probe with node itself.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot runs `pnpm install` for the whole workspace.
      start_period: 240s
    depends_on:
      api:
        # Wait for Django to actually answer, not merely for the container to
        # exist: the frontend's server components call the API while rendering,
        # so starting early produces a page full of connection errors.
        condition: service_healthy

  # ---------------------------- observability (optional, separate file) ---
  # LLM tracing, prompt versioning, cost tracking and evaluation live in
  # docker-compose.observability.yml, not here:
  #   docker compose -f docker-compose.yaml -f docker-compose.observability.yml up -d
  # (or just `make observability`)
  #
  # They cannot be a `profiles:` entry in this file: `langfuse-worker` needs a
  # `${LANGFUSE_ENCRYPTION_KEY:?...}` guard because that key encrypts stored
  # secrets, and Compose interpolates every variable in a file *before* it
  # evaluates profiles. With the services here, that guard made a plain
  # `docker compose up` fail for everyone who does not use Langfuse at all.

  # --------------------------------------------- local models (optional) ---
  # Run entirely offline: point LLM_BASE_URL/EMBEDDER_BASE_URL at http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    expose:
      - "11434"
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
  ollama-data:
  # Shared so api and worker do not each re-download embedding/rerank models.
  model-cache:
  flashrank-cache:
  # The langfuse-* volumes are declared in docker-compose.observability.yml,
  # alongside the services that mount them.
