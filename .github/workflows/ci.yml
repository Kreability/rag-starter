name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Pinned to match docker-compose.yaml: Qdrant storage is not forward
      # compatible, so the image and qdrant-client move together.
      qdrant:
        image: qdrant/qdrant:v1.12.6
        ports:
          - 6333:6333

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-not-a-real-secret
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      VECTOR_DB_URL: http://localhost:6333
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync

      # ruff is configured in pyproject.toml but is not a project dependency, so
      # run it as a tool. Version pinned to match .pre-commit-config.yaml.
      - name: Ruff
        run: uvx ruff@0.14.2 check --no-fix .

      # Integration tests skip themselves when Qdrant is unreachable, so wait for
      # it: a silent skip would look like a pass.
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Tests
        run: uv run pytest rag/tests/ api/tests/ -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install -r --frozen-lockfile

      # Biome runs in the Lint workflow via pre-commit; not duplicated here.
      # API_URL has a code-level fallback, but set it explicitly so a CI build
      # never depends on that default.
      - name: Build
        env:
          API_URL: http://localhost:8000
          NEXTAUTH_SECRET: ci-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
        run: pnpm --filter web build

  docker:
    name: Docker (compose config + image build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: |
          cp .env.backend.template .env.backend
          cp .env.frontend.template .env.frontend
          docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
